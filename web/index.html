<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Swiss Flood</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="ui/swissflood-ui.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.min.js"></script>
  <script src="ui/swissflood-ui.js"></script>
  <style>
    /* The national colour map is busy; desaturate it so the flood overlay stands out. */
    .tiles-color { filter: saturate(0.4); }
    /* 1px shoreline around the flooded area: four offset copies of the flood layer's shape. */
    .leaflet-flood-pane {
      filter: drop-shadow(1px 0 0 #0b3d91) drop-shadow(-1px 0 0 #0b3d91) drop-shadow(0 1px 0 #0b3d91) drop-shadow(0 -1px 0 #0b3d91);
    }
    /* Dashes move from the overflow point towards the border. */
    .overflow-flow { animation: overflow-flow 0.8s linear infinite; }
    @keyframes overflow-flow { to { stroke-dashoffset: -16; } }
  </style>
</head>
<body>
  <div id="map"></div>
  <script type="module" src="flood.js"></script>
</body>
</html>
